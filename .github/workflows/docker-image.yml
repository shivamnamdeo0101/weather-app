# ============================================================
# 🐳 Docker CI & ☸️ Kubernetes CD Pipeline
# ------------------------------------------------------------
# This workflow:
# 1. Builds and pushes Docker images for each microservice
# 2. Deploys them to Kubernetes (dev / test / prod)
# ------------------------------------------------------------
# Branch-based environments:
#   - dev   → development environment
#   - test  → testing environment
#   - prod  → production environment
# ============================================================

name: Docker CI & Kubernetes Deploy

# ------------------------------------------------------------
# 🧩 Trigger workflow on push or PR to these branches
# ------------------------------------------------------------
on:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "dev", "test", "prod" ]

# ------------------------------------------------------------
# 🔐 Global environment variables (from GitHub Secrets)
# ------------------------------------------------------------
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # 🌍 Environment setup based on current Git branch
    # --------------------------------------------------------
    env:
      SPRING_PROFILES_ACTIVE: "${{ github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/test' && 'test' || github.ref == 'refs/heads/dev' && 'dev' || 'dev' }}"
      IMAGE_TAG: "${{ (github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/test' && 'test' || github.ref == 'refs/heads/dev' && 'dev' || 'dev') }}-${{ github.run_number }}"

    steps:
      # ------------------------------------------------------
      # 1️⃣ Checkout the latest code
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2️⃣ Login to Docker Hub using GitHub Secrets
      # ------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # ------------------------------------------------------
      # 3️⃣ Build Docker images for each service
      # ------------------------------------------------------
      - name: Build weather-client image
        run: docker build . -t shivamnamdeo0101/weather-client:${{ env.IMAGE_TAG }}
        working-directory: ./client

      - name: Build weather-cache image
        run: docker build . -t shivamnamdeo0101/weather-cache:${{ env.IMAGE_TAG }}
        working-directory: ./server/weather-cache

      - name: Build weather-svc image
        run: docker build . -t shivamnamdeo0101/weather-svc:${{ env.IMAGE_TAG }}
        working-directory: ./server/weather-svc

      # ------------------------------------------------------
      # 4️⃣ Push Docker images to Docker Hub
      # ------------------------------------------------------
      - name: Push weather-client image
        run: docker push shivamnamdeo0101/weather-client:${{ env.IMAGE_TAG }}

      - name: Push weather-cache image
        run: docker push shivamnamdeo0101/weather-cache:${{ env.IMAGE_TAG }}

      - name: Push weather-svc image
        run: docker push shivamnamdeo0101/weather-svc:${{ env.IMAGE_TAG }}

      # ------------------------------------------------------
      # 5️⃣ Install kubectl (Kubernetes CLI)
      # ------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      # ------------------------------------------------------
      # 6️⃣ Configure kubeconfig for cluster access
      # ------------------------------------------------------
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      # ------------------------------------------------------
      # 7️⃣ Deploy services to Kubernetes
      # ------------------------------------------------------
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/weather-app
          kubectl rollout status deployment/weather-cache
          kubectl rollout status deployment/weather-svc
          kubectl rollout status deployment/redis-db
