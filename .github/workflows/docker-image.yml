# ============================================================
# 🐳 Docker CI & ☸️ Kubernetes CD Pipeline
# ------------------------------------------------------------
# Builds Docker images for each microservice and deploys
# them to Kubernetes (AKS) automatically per environment.
# ------------------------------------------------------------
# Branch ↔ Environment Mapping:
#   dev   → development
#   test  → testing
#   prod  → production
# ============================================================

name: Docker CI & Kubernetes CD

on:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "dev", "test", "prod" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # 🧩 Resolve environment and image tag dynamically
      GITHUB_REF_NAME: "${{ github.ref_name }}"
      IMAGE_TAG: "${{ github.ref_name }}-${{ github.run_number }}"

    steps:
      # ------------------------------------------------------
      # 1️⃣ Checkout the latest code
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2️⃣ Login to Docker Hub
      # ------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # ------------------------------------------------------
      # 3️⃣ Build Docker images for all microservices
      # ------------------------------------------------------
      - name: Build weather-client image
        run: docker build . -t shivamnamdeo0101/weather-client:${{ env.IMAGE_TAG }}
        working-directory: ./client

      - name: Build weather-cache image
        run: docker build . -t shivamnamdeo0101/weather-cache:${{ env.IMAGE_TAG }}
        working-directory: ./server/weather-cache

      - name: Build weather-svc image
        run: docker build . -t shivamnamdeo0101/weather-svc:${{ env.IMAGE_TAG }}
        working-directory: ./server/weather-svc

      # ------------------------------------------------------
      # 4️⃣ Push all Docker images
      # ------------------------------------------------------
      - name: Build weather-client image
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            URL="${{ secrets.DEV_API_URL }}"
          elif [[ "${GITHUB_REF_NAME}" == "test" ]]; then
            URL="${{ secrets.TEST_API_URL }}"
          else
            URL="${{ secrets.PROD_API_URL }}"
          fi

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$URL \
            -t shivamnamdeo0101/weather-client:${{ env.IMAGE_TAG }} .
        working-directory: ./client


      - name: Push weather-cache image
        run: docker push shivamnamdeo0101/weather-cache:${{ env.IMAGE_TAG }}

      - name: Push weather-svc image
        run: docker push shivamnamdeo0101/weather-svc:${{ env.IMAGE_TAG }}

      # ------------------------------------------------------
      # 5️⃣ Setup kubectl CLI
      # ------------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      # ------------------------------------------------------
      # 6️⃣ Configure kubeconfig (AKS access)
      # ------------------------------------------------------
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      # ------------------------------------------------------
      # 7️⃣ Update images and apply manifests
      # ------------------------------------------------------
      - name: Deploy to AKS
        run: |
          echo "🚀 Deploying to environment: ${{ env.GITHUB_REF_NAME }}"
          echo "🔖 Image tag: ${{ env.IMAGE_TAG }}"
          
          # Replace image tags dynamically inside manifests
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" k8s/*.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f k8s/

          # Verify rollout for each service
          kubectl rollout status deployment/weather-app
          kubectl rollout status deployment/weather-cache
          kubectl rollout status deployment/weather-svc

      # ------------------------------------------------------
      # 8️⃣ (Optional) Show status summary
      # ------------------------------------------------------
      - name: Verify all pods and services
        run: |
          echo "🔍 Checking current cluster status..."
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get deployments
          kubectl get replicasets
